[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kinna"
version = "0.1.0"
description = "Kinematic Linguistics v1.4 — A geometric substrate for semantic reliability"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
wordnet = ["nltk>=3.8"]
dev = ["pytest>=7.0"]

[project.scripts]
kinna = "kinna.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
